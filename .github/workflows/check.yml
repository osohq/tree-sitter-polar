name: Check
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  queries:
    name: Check tree-sitter query files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action@v2
      - name: Check
        run: make checkquery
  test:
    name: Test grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action@v2
      - name: Run corpus tests
        run: make test
      - name: Test the Rust binding
        run: cargo test

